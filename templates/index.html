<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Orange & White UI</title>
    <!-- Tailwind CSS for sleek styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Lucide Icons for clean visuals -->
    <script src="https://unpkg.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-orange-50/50 flex h-screen items-center justify-center font-sans antialiased">

    <!-- Main Container with Smooth Rounded Corners -->
    <div class="w-full max-w-4xl h-[85vh] bg-white rounded-3xl shadow-2xl border border-orange-100 flex overflow-hidden m-4 transition-all duration-300 hover:shadow-orange-100/50">
        
        <!-- Sidebar (Orange Gradient) -->
        <div class="w-1/3 bg-gradient-to-b from-orange-500 to-amber-600 p-6 flex flex-col justify-between text-white hidden md:flex">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-md">
                        <i data-lucide="message-square" class="w-6 h-6 text-white"></i>
                    </div>
                    <span class="text-xl font-bold tracking-wide">OrangeChat</span>
                </div>
                
                <nav class="space-y-2">
                    <a href="#" class="flex items-center gap-3 bg-white/15 px-4 py-3 rounded-2xl font-medium transition-all hover:bg-white/20">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> मुख्य डैशबोर्ड
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl opacity-80 hover:opacity-100 hover:bg-white/5 transition-all">
                        <i data-lucide="settings" class="w-5 h-5"></i> सेटिंग्स
                    </a>
                </nav>
            </div>
            
            <div class="flex items-center gap-3 border-t border-white/10 pt-4">
                <div class="w-10 h-10 rounded-full bg-white text-orange-600 flex items-center justify-center font-bold text-lg shadow-md">
                    U
                </div>
                <div>
                    <p class="font-semibold text-sm">यूजर प्रोफाइल</p>
                    <p class="text-xs text-orange-200">ऑनलाइन</p>
                </div>
            </div>
        </div>

        <!-- Chat / Main Content Area (White Theme) -->
        <div class="flex-1 flex flex-col h-full bg-white">
            
            <!-- Top Header -->
            <div class="px-6 py-4 border-b border-orange-100 flex items-center justify-between bg-white">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                    <h2 class="text-lg font-bold text-gray-800">एआई असिस्टेंट</h2>
                </div>
                <button class="p-2 text-gray-400 hover:text-orange-500 rounded-xl hover:bg-orange-50 transition-all">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Messages Area (Scrollable) -->
            <div class="flex-1 overflow-y-auto p-6 space-y-4 bg-gradient-to-b from-transparent to-orange-50/20">
                
                <!-- Incoming Message (AI) -->
                <div class="flex items-start gap-3 max-w-[80%] animate-fade-in">
                    <div class="w-8 h-8 rounded-xl bg-orange-500 flex items-center justify-center text-white shrink-0 shadow-md shadow-orange-500/20">
                        <i data-lucide="bot" class="w-4 h-4"></i>
                    </div>
                    <div class="bg-orange-50 text-gray-800 p-4 rounded-2xl rounded-tl-sm shadow-sm border border-orange-100/50">
                        <p class="text-sm leading-relaxed">नमस्ते! मैं आपका नया सुपर स्टाइलिश असिस्टेंट हूँ। आपको यह ऑरेंज और व्हाइट थीम कैसी लगी?</p>
                    </div>
                </div>

                <!-- Outgoing Message (User) -->
                <div class="flex items-start gap-3 max-w-[80%] ml-auto flex-row-reverse animate-fade-in">
                    <div class="w-8 h-8 rounded-xl bg-gray-800 flex items-center justify-center text-white shrink-0 shadow-md">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <div class="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-4 rounded-2xl rounded-tr-sm shadow-md shadow-orange-500/10">
                        <p class="text-sm leading-relaxed">यह दिखने में बहुत ही शानदार और प्रीमियम लग रहा है भाई!</p>
                    </div>
                </div>

            </div>

            <!-- Input Action Bar -->
            <div class="p-4 bg-white border-t border-orange-100">
                <div class="flex items-center gap-2 bg-orange-50/50 p-2 rounded-2xl border border-orange-100 focus-within:border-orange-400 focus-within:ring-2 focus-within:ring-orange-100 transition-all">
                    <input type="text" placeholder="अपना संदेश यहाँ टाइप करें..." class="flex-1 bg-transparent px-3 py-2 text-sm text-gray-800 outline-none placeholder-gray-400">
                    <button class="bg-orange-500 hover:bg-orange-600 text-white p-2.5 rounded-xl shadow-md shadow-orange-500/20 transition-all active:scale-95 flex items-center justify-center">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
