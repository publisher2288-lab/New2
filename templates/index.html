<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrangeChat - मेरा Premium AI</title>
    <!-- बिना ब्लॉक होने वाला सबसे सुरक्षित Tailwind CSS CDN लिंक -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .custom-gradient {
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
        }
        .orange-shadow {
            box-shadow: 0 10px 25px -5px rgba(255, 126, 95, 0.3);
        }
        /* स्क्रॉलबार को सुंदर बनाने के लिए */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ff7e5f; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans p-2 sm:p-4">

    <!-- मुख्य चैट कंटेनर -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl flex flex-col h-[85vh] sm:h-[80vh] overflow-hidden border border-orange-100">
        
        <!-- प्रीमियम ऑरेंज हेडर -->
        <header class="custom-gradient px-6 py-4 flex items-center justify-between text-white shadow-md">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md">
                    <span class="text-2xl">🤖</span>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">OrangeChat AI</h1>
                    <p class="text-xs text-orange-100 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-400 inline-block animate-pulse"></span> ऑनलाइन सहायक
                    </p>
                </div>
            </div>
            <div class="text-xs bg-white/20 px-3 py-1 rounded-full font-semibold border border-white/20">
                Gemini 3.6
            </div>
        </header>

        <!-- चैट मैसेजेस एरिया -->
        <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 bg-orange-50/30">
            <!-- शुरुआती स्वागत मैसेज -->
            <div class="flex gap-2 items-end max-w-[85%]">
                <div class="w-8 h-8 rounded-full custom-gradient flex items-center justify-center text-sm shadow-sm flex-shrink-0 text-white font-bold">AI</div>
                <div class="bg-white text-gray-800 p-3.5 rounded-2xl rounded-bl-none shadow-sm border border-orange-100 text-sm leading-relaxed">
                    नमस्ते! मैं आपका नया सुपर स्टाइलिश और मॉडर्न एआई असिस्टेंट हूँ। आपको यह नया **ऑरेंज और व्हाइट** लुक कैसा लगा? मुझसे कुछ भी पूछें!
                </div>
            </div>
        </div>

        <!-- इनपुट और बटन एरिया -->
        <div class="p-4 bg-white border-t border-orange-100">
            <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-200 focus-within:border-orange-400 focus-within:ring-2 focus-within:ring-orange-100 transition-all">
                <input id="user-input" type="text" placeholder="अपना संदेश यहाँ टाइप करें..." 
                       class="flex-1 p-2 bg-transparent text-gray-800 focus:outline-none text-sm"
                       onkeypress="if(event.key === 'Enter') sendMessage()">
                
                <button onclick="sendMessage()" class="custom-gradient hover:opacity-90 active:scale-95 text-white px-5 py-2.5 rounded-lg font-bold text-sm transition-all shadow-md flex items-center gap-1 cursor-pointer">
                    <span>भेजें</span> ➔
                </button>
            </div>
        </div>

    </div>

    <!-- वीडियो बैकएंड लॉजिक स्क्रिप्ट -->
    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if(!input.value.trim()) return;
            
            const text = input.value;
            input.value = '';

            // 1. यूजर का मैसेज स्क्रीन पर स्टाइल के साथ जोड़ना
            chatBox.innerHTML += `
                <div class="flex gap-2 items-end justify-end max-w-[85%] ml-auto">
                    <div class="custom-gradient text-white p-3.5 rounded-2xl rounded-br-none shadow-sm text-sm leading-relaxed">
                        ${text}
                    </div>
                </div>
            `;
            
            // नीचे स्क्रॉल करना
            chatBox.scrollTop = chatBox.scrollHeight;

            // लोडिंग इंडिकेटर दिखाना
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex gap-2 items-end max-w-[85%]">
                    <div class="w-8 h-8 rounded-full custom-gradient flex items-center justify-center text-sm text-white font-bold">AI</div>
                    <div class="bg-white text-gray-400 p-3.5 rounded-2xl rounded-bl-none shadow-sm border border-orange-100 text-sm">
                        <span class="animate-pulse">एआई सोच रहा है...</span>
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 2. बैकएंड सर्वर से बात करना
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();
                
                // लोडिंग हटाना
                document.getElementById(loadingId).remove();

                // 3. AI का जवाब स्क्रीन पर प्रीमियम स्टाइल में जोड़ना
                chatBox.innerHTML += `
                    <div class="flex gap-2 items-end max-w-[85%]">
                        <div class="w-8 h-8 rounded-full custom-gradient flex items-center justify-center text-sm text-white font-bold">AI</div>
                        <div class="bg-white text-gray-800 p-3.5 rounded-2xl rounded-bl-none shadow-sm border border-orange-100 text-sm leading-relaxed">
                            ${data.reply}
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="flex gap-2 items-end max-w-[85%]">
                        <div class="w-8 h-8 rounded-full bg-red-500 flex items-center justify-center text-sm text-white font-bold">!</div>
                        <div class="bg-red-50 text-red-600 p-3.5 rounded-2xl rounded-bl-none shadow-sm border border-red-100 text-sm">
                            कनेक्शन में त्रुटि आई। कृपया पुनः प्रयास करें।
                        </div>
                    </div>
                `;
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
