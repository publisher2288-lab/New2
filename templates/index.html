<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vineet 1.0 — AskGemi AI</title>

<style>
:root {
    --bg: #212121;
    --sidebar: #171717;
    --surface: #2f2f2f;
    --surface2: #383838;
    --border: #424242;
    --text: #ececec;
    --muted: #a7a7a7;
    --orange: #ff6b35;
    --user: #303030;
    --danger: #ef4444;
    --green: #22c55e;
}

[data-theme="light"] {
    --bg: #ffffff;
    --sidebar: #f7f7f8;
    --surface: #f1f1f1;
    --surface2: #e7e7e7;
    --border: #dedede;
    --text: #171717;
    --muted: #666;
    --user: #eeeeee;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);
    overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 275px;
    height: 100vh;
    background: var(--sidebar);
    border-right: 1px solid var(--border);

    display: flex;
    flex-direction: column;

    padding: 14px;

    flex-shrink: 0;
    z-index: 30;

    transition: transform .25s ease;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 5px 18px;
}

.brand-logo {
    width: 38px;
    height: 38px;
    border-radius: 11px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #fff;
    font-weight: 900;
    font-size: 18px;

    background:
        linear-gradient(
            135deg,
            #ff8a4c,
            #ff5a1f
        );

    box-shadow:
        0 5px 20px rgba(255,107,53,.25);
}

.brand-title {
    font-size: 17px;
    font-weight: 750;
}

.brand-subtitle {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
}

/* New Chat */

.new-chat {
    width: 100%;
    height: 44px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: transparent;
    color: var(--text);

    cursor: pointer;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 0 13px;

    font-size: 14px;

    transition: .2s;
}

.new-chat:hover {
    background: var(--surface);
}

/* Search */

.search-box {
    margin-top: 10px;

    height: 40px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: var(--surface);

    display: flex;
    align-items: center;

    padding: 0 11px;

    gap: 8px;
}

.search-box span {
    color: var(--muted);
}

.search-box input {
    width: 100%;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);

    font-size: 13px;
}

/* History */

.history-heading {
    color: var(--muted);

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;

    margin: 20px 8px 8px;
}

.history {
    flex: 1;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    gap: 3px;
}

.history-item {
    padding: 10px 11px;

    border-radius: 8px;

    color: var(--muted);

    font-size: 13px;

    cursor: pointer;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    transition: .2s;
}

.history-item:hover,
.history-item.active {
    background: var(--surface);
    color: var(--text);
}

/* Sidebar bottom */

.sidebar-bottom {
    border-top: 1px solid var(--border);

    padding-top: 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.version {
    color: var(--muted);
    font-size: 11px;
}

.theme-button {
    width: 35px;
    height: 35px;

    border: 0;
    border-radius: 8px;

    background: transparent;
    color: var(--text);

    cursor: pointer;
    font-size: 17px;
}

.theme-button:hover {
    background: var(--surface);
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-width: 0;

    height: 100vh;

    display: flex;
    flex-direction: column;

    position: relative;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 58px;

    flex-shrink: 0;

    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;
}

.top-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.mobile-menu {
    display: none;

    width: 36px;
    height: 36px;

    border: 0;
    border-radius: 8px;

    background: transparent;
    color: var(--text);

    cursor: pointer;
    font-size: 20px;
}

.assistant-name {
    font-size: 15px;
    font-weight: 750;
}

.model-label {
    padding: 5px 10px;

    border-radius: 20px;

    background: var(--surface);

    border: 1px solid var(--border);

    color: var(--muted);

    font-size: 11px;
}

/* =========================
   CHAT
========================= */

.chat {
    flex: 1;

    overflow-y: auto;

    padding:
        25px
        12px
        165px;

    scroll-behavior: smooth;
}

.message {
    width: 100%;

    display: flex;
    justify-content: center;

    padding: 15px 10px;
}

.message-inner {
    width: 100%;
    max-width: 820px;

    display: flex;
    gap: 13px;

    line-height: 1.65;

    font-size: 15px;
}

.avatar {
    width: 34px;
    height: 34px;

    flex-shrink: 0;

    border-radius: 9px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 13px;
    font-weight: 800;
}

.ai-avatar {
    color: #fff;

    background:
        linear-gradient(
            135deg,
            #ff8a4c,
            #ff5a1f
        );
}

.user-avatar {
    color: #fff;

    background:
        linear-gradient(
            135deg,
            #6d5dfc,
            #5043c7
        );
}

.message-text {
    flex: 1;

    min-width: 0;

    padding-top: 3px;

    white-space: pre-wrap;

    word-break: break-word;
}

/* User */

.user-message .message-inner {
    justify-content: flex-end;
}

.user-message .avatar {
    order: 2;
}

.user-message .message-text {
    flex: initial;

    max-width: min(75%, 650px);

    background: var(--user);

    padding: 11px 15px;

    border-radius: 16px;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;

    align-items: center;

    gap: 4px;

    margin-top: 9px;

    opacity: 0;

    transition: opacity .2s;
}

.ai-message:hover .actions {
    opacity: 1;
}

.action {
    border: 0;

    background: transparent;

    color: var(--muted);

    padding: 5px 7px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 12px;
}

.action:hover {
    background: var(--surface);
    color: var(--text);
}

.action.active {
    color: var(--orange);
}

/* =========================
   LOADING
========================= */

.loading {
    color: var(--muted);

    display: flex;
    align-items: center;
    gap: 6px;
}

.dots {
    display: flex;
    gap: 3px;
}

.dots i {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--orange);

    animation: dot 1.2s infinite;
}

.dots i:nth-child(2) {
    animation-delay: .15s;
}

.dots i:nth-child(3) {
    animation-delay: .3s;
}

@keyframes dot {
    0%, 60%, 100% {
        opacity: .25;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* =========================
   INPUT
========================= */

.input-area {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        20px
        20px
        17px;

    background:
        linear-gradient(
            to top,
            var(--bg) 70%,
            transparent
        );
}

.input-box {
    width: 100%;
    max-width: 820px;

    margin: auto;
}

.input-wrapper {
    min-height: 59px;

    display: flex;
    align-items: flex-end;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 10px 10px 10px 16px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.18);

    transition: .2s;
}

.input-wrapper:focus-within {
    border-color: #666;

    box-shadow:
        0 12px 35px rgba(0,0,0,.25);
}

textarea {
    flex: 1;

    width: 100%;

    min-height: 35px;
    max-height: 180px;

    resize: none;

    overflow-y: auto;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);

    font-size: 15px;

    line-height: 1.5;

    padding: 7px 5px;
}

textarea::placeholder {
    color: var(--muted);
}

.input-buttons {
    display: flex;
    gap: 5px;
    padding-left: 5px;
}

.input-button {
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 10px;

    background: transparent;
    color: var(--text);

    cursor: pointer;

    font-size: 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: .2s;
}

.input-button:hover {
    background: var(--surface2);
}

.send-button {
    background: var(--text);
    color: var(--bg);

    font-size: 18px;
    font-weight: 800;
}

.send-button:hover {
    transform: scale(1.04);
}

.mic-listening {
    background: var(--danger) !important;
    color: #fff !important;

    animation: micPulse 1.3s infinite;
}

@keyframes micPulse {
    0% {
        box-shadow: 0 0 0 0 rgba(239,68,68,.5);
    }

    70% {
        box-shadow: 0 0 0 10px rgba(239,68,68,0);
    }

    100% {
        box-shadow: 0 0 0 0 rgba(239,68,68,0);
    }
}

.disclaimer {
    text-align: center;

    color: var(--muted);

    font-size: 10px;

    margin-top: 8px;
}

/* =========================
   MOBILE
========================= */

.overlay {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.5);

    z-index: 25;
}

@media(max-width:760px) {

    .sidebar {
        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        transform: translateX(-100%);

        box-shadow:
            10px 0 35px rgba(0,0,0,.3);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .overlay.active {
        display: block;
    }

    .mobile-menu {
        display: block;
    }

    .model-label {
        display: none;
    }

    .topbar {
        padding: 0 12px;
    }

    .chat {
        padding:
            15px
            5px
            155px;
    }

    .message {
        padding: 10px 3px;
    }

    .message-inner {
        gap: 9px;
        font-size: 14px;
    }

    .avatar {
        width: 30px;
        height: 30px;
    }

    .user-message .message-text {
        max-width: 83%;
    }

    .input-area {
        padding:
            12px
            10px
            calc(12px + env(safe-area-inset-bottom));
    }

    .input-wrapper {
        border-radius: 16px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="brand-logo">
                V
            </div>

            <div>
                <div class="brand-title">
                    Vineet 1.0
                </div>

                <div class="brand-subtitle">
                    AskGemi AI
                </div>
            </div>

        </div>


        <button
            class="new-chat"
            id="new-chat"
        >
            <span>＋</span>
            <span>New Chat</span>
        </button>


        <div class="search-box">

            <span>⌕</span>

            <input
                type="text"
                id="search-chats"
                placeholder="Search chats..."
            >

        </div>


        <div class="history-heading">
            Recent Chats
        </div>


        <div
            class="history"
            id="history"
        >

            <div class="history-item active">
                नई बातचीत
            </div>

            <div class="history-item">
                Vineet 1.0 AI Project
            </div>

            <div class="history-item">
                कल की बातचीत...
            </div>

        </div>


        <div class="sidebar-bottom">

            <span class="version">
                Vineet 1.0
            </span>

            <button
                class="theme-button"
                id="theme-button"
                title="Theme"
            >
                🌙
            </button>

        </div>

    </aside>


    <div
        class="overlay"
        id="overlay"
    ></div>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <header class="topbar">

            <div class="top-left">

                <button
                    class="mobile-menu"
                    id="mobile-menu"
                >
                    ☰
                </button>

                <div class="assistant-name">
                    AskGemi AI
                </div>

            </div>


            <div class="model-label">
                Vineet 1.0
            </div>

        </header>


        <!-- ================= CHAT ================= -->

        <section
            class="chat"
            id="chat"
        >

            <div class="message ai-message">

                <div class="message-inner">

                    <div class="avatar ai-avatar">
                        V
                    </div>

                    <div class="message-text">

                        नमस्ते! 👋

                        मैं <strong>AskGemi AI</strong> हूँ।
                        Vineet 1.0 में आपका स्वागत है।

                        आप मुझसे कुछ भी पूछ सकते हैं।

                        <div class="actions">

                            <button
                                class="action"
                                onclick="copyMessage(this)"
                            >
                                📋 Copy
                            </button>

                            <button
                                class="action"
                                onclick="regenerateMessage(this)"
                            >
                                🔄 Regenerate
                            </button>

                            <button
                                class="action"
                                onclick="likeMessage(this)"
                            >
                                👍
                            </button>

                            <button
                                class="action"
                                onclick="dislikeMessage(this)"
                            >
                                👎
                            </button>

                            <button
                                class="action"
                                onclick="readMessage(this)"
                            >
                                🔊
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- ================= INPUT ================= -->

        <div class="input-area">

            <div class="input-box">

                <div class="input-wrapper">

                    <textarea
                        id="user-input"
                        rows="1"
                        placeholder="Message AskGemi AI..."
                    ></textarea>


                    <div class="input-buttons">

                        <button
                            class="input-button"
                            id="mic-button"
                            title="Voice typing"
                        >
                            🎙️
                        </button>


                        <button
                            class="input-button send-button"
                            id="send-button"
                            title="Send"
                        >
                            ➤
                        </button>

                    </div>

                </div>


                <div class="disclaimer">
                    AskGemi AI can make mistakes. महत्वपूर्ण जानकारी verify करें।
                </div>

            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("user-input");

const sendButton =
    document.getElementById("send-button");

const micButton =
    document.getElementById("mic-button");

const newChat =
    document.getElementById("new-chat");

const themeButton =
    document.getElementById("theme-button");

const searchChats =
    document.getElementById("search-chats");

const history =
    document.getElementById("history");

const sidebar =
    document.getElementById("sidebar");

const overlay =
    document.getElementById("overlay");

const mobileMenu =
    document.getElementById("mobile-menu");


/* =========================================================
   THEME
========================================================= */

const savedTheme =
    localStorage.getItem("vineet-theme");

if (savedTheme) {

    document.documentElement
        .setAttribute(
            "data-theme",
            savedTheme
        );

    themeButton.textContent =
        savedTheme === "light"
            ? "☀️"
            : "🌙";
}


themeButton.addEventListener(
    "click",
    () => {

        const current =
            document.documentElement
                .getAttribute(
                    "data-theme"
                );

        const next =
            current === "dark"
                ? "light"
                : "dark";

        document.documentElement
            .setAttribute(
                "data-theme",
                next
            );

        themeButton.textContent =
            next === "light"
                ? "☀️"
                : "🌙";

        localStorage.setItem(
            "vineet-theme",
            next
        );
    }
);


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

mobileMenu.addEventListener(
    "click",
    () => {

        sidebar.classList.add("open");

        overlay.classList.add("active");
    }
);


overlay.addEventListener(
    "click",
    closeSidebar
);


function closeSidebar() {

    sidebar.classList.remove("open");

    overlay.classList.remove("active");
}


/* =========================================================
   TEXTAREA
========================================================= */

function resizeInput() {

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";
}


input.addEventListener(
    "input",
    resizeInput
);


/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let listening = false;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "hi-IN";


    recognition.onstart = () => {

        listening = true;

        micButton.classList.add(
            "mic-listening"
        );

        micButton.textContent = "🛑";
    };


    recognition.onresult = event => {

        input.value =
            event.results[0][0]
                .transcript;

        resizeInput();
    };


    recognition.onerror = event => {

        console.error(
            "Voice error:",
            event.error
        );

        if (
            event.error ===
            "not-allowed"
        ) {

            alert(
                "Microphone permission Allow करें।"
            );
        }

        stopListening();
    };


    recognition.onend =
        stopListening;
}


micButton.addEventListener(
    "click",
    () => {

        if (!SpeechRecognition) {

            alert(
                "Chrome या Edge में Voice Typing इस्तेमाल करें।"
            );

            return;
        }

        if (listening) {

            recognition.stop();

        } else {

            try {
                recognition.start();
            } catch (e) {
                console.log(e);
            }
        }
    }
);


function stopListening() {

    listening = false;

    micButton.classList.remove(
        "mic-listening"
    );

    micButton.textContent = "🎙️";
}


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speakText(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(
            text
        );

    voice.lang =
        /[\u0900-\u097F]/.test(text)
            ? "hi-IN"
            : "en-US";

    voice.rate = 1;

    speechSynthesis.speak(voice);
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    input.value = "";

    resizeInput();


    if (
        listening &&
        recognition
    ) {
        recognition.stop();
    }


    speechSynthesis.cancel();


    /* USER */

    chat.insertAdjacentHTML(
        "beforeend",
        `
        <div class="message user-message">

            <div class="message-inner">

                <div class="avatar user-avatar">
                    U
                </div>

                <div class="message-text">
                    ${escapeHTML(text)}
                </div>

            </div>

        </div>
        `
    );


    scrollBottom();


    /* LOADING */

    const loadingId =
        "loading-" +
        Date.now();


    chat.insertAdjacentHTML(
        "beforeend",
        `
        <div
            class="message ai-message"
            id="${loadingId}"
        >

            <div class="message-inner">

                <div class="avatar ai-avatar">
                    V
                </div>

                <div class="message-text loading">

                    AskGemi AI सोच रहा है

                    <span class="dots">
                        <i></i>
                        <i></i>
                        <i></i>
                    </span>

                </div>

            </div>

        </div>
        `
    );


    scrollBottom();


    /* =====================================================
       EXISTING BACKEND
    ===================================================== */

    try {

        const response =
            await fetch(
                "/ask",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text
                        })
                }
            );


        if (!response.ok) {
            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        const loading =
            document.getElementById(
                loadingId
            );

        if (loading) {
            loading.remove();
        }


        const reply =
            data.reply ||
            "कोई जवाब नहीं मिला।";


        addAIMessage(reply);


        scrollBottom();


        speakText(reply);


    } catch (error) {

        console.error(
            "AskGemi API Error:",
            error
        );


        const loading =
            document.getElementById(
                loadingId
            );

        if (loading) {
            loading.remove();
        }


        chat.insertAdjacentHTML(
            "beforeend",
            `
            <div class="message ai-message">

                <div class="message-inner">

                    <div
                        class="avatar"
                        style="background:#ef4444;color:white;"
                    >
                        !
                    </div>

                    <div
                        class="message-text"
                        style="color:#ef4444;"
                    >

                        AskGemi AI server से
                        connection नहीं हो पाया।

                        <div class="actions">

                            <button
                                class="action"
                                onclick="sendMessage()"
                            >
                                🔄 Retry
                            </button>

                        </div>

                    </div>

                </div>

            </div>
            `
        );

        scrollBottom();
    }
}


/* =========================================================
   ADD AI MESSAGE
========================================================= */

function addAIMessage(reply) {

    chat.insertAdjacentHTML(
        "beforeend",
        `
        <div class="message ai-message">

            <div class="message-inner">

                <div class="avatar ai-avatar">
                    V
                </div>

                <div class="message-text">

                    ${escapeHTML(reply)}

                    <div class="actions">

                        <button
                            class="action"
                            onclick="copyMessage(this)"
                        >
                            📋 Copy
                        </button>

                        <button
                            class="action"
                            onclick="regenerateMessage(this)"
                        >
                            🔄 Regenerate
                        </button>

                        <button
                            class="action"
                            onclick="likeMessage(this)"
                        >
                            👍
                        </button>

                        <button
                            class="action"
                            onclick="dislikeMessage(this)"
                        >
                            👎
                        </button>

                        <button
                            class="action"
                            onclick="readMessage(this)"
                        >
                            🔊
                        </button>

                    </div>

                </div>

            </div>

        </div>
        `
    );
}


/* =========================================================
   COPY
========================================================= */

function getMessageText(button) {

    const wrapper =
        button.closest(
            ".message-text"
        );

    if (!wrapper) {
        return "";
    }

    const clone =
        wrapper.cloneNode(true);

    const actions =
        clone.querySelector(
            ".actions"
        );

    if (actions) {
        actions.remove();
    }

    return clone.innerText.trim();
}


function copyMessage(button) {

    const text =
        getMessageText(button);

    if (!text) {
        return;
    }


    navigator.clipboard
        .writeText(text)
        .then(() => {

            const old =
                button.innerText;

            button.innerText =
                "✓ Copied";

            setTimeout(() => {

                button.innerText =
                    old;

            }, 1500);
        });
}


/* =========================================================
   READ ALOUD
========================================================= */

function readMessage(button) {

    const text =
        getMessageText(button);

    speakText(text);
}


/* =========================================================
   LIKE
========================================================= */

function likeMessage(button) {

    const parent =
        button.closest(".actions");

    parent
        .querySelectorAll(".action")
        .forEach(btn => {

            if (
                btn.innerText.includes("👍") ||
                btn.innerText.includes("👎")
            ) {
                btn.classList.remove("active");
            }

        });

    button.classList.add("active");
}


/* =========================================================
   DISLIKE
========================================================= */

function dislikeMessage(button) {

    const parent =
        button.closest(".actions");

    parent
        .querySelectorAll(".action")
        .forEach(btn => {

            if (
                btn.innerText.includes("👍") ||
                btn.innerText.includes("👎")
            ) {
                btn.classList.remove("active");
            }

        });

    button.classList.add("active");
}


/* =========================================================
   REGENERATE
========================================================= */

function regenerateMessage(button) {

    const currentMessage =
        button.closest(".message");

    if (!currentMessage) {
        return;
    }


    let previous =
        currentMessage.previousElementSibling;


    while (
        previous &&
        !previous.classList.contains(
            "user-message"
        )
    ) {
        previous =
            previous.previousElementSibling;
    }


    if (!previous) {
        return;
    }


    const previousText =
        previous.querySelector(
            ".message-text"
        );


    if (!previousText) {
        return;
    }


    input.value =
        previousText.innerText.trim();

    resizeInput();

    sendMessage();
}

   NEW CHAT
========================================================= */

newChat.addEventListener(

        chat.innerHTML = `

/* =========================================================
   SEARCH CHATS
========================================================= */

searchChats.addEventListener(
    "input",
    () => {

        const query =
            searchChats.value
                .toLowerCase()
                .trim();


        document
            .querySelectorAll(
                ".history-item"
            )
            .forEach(item => {

                const text =
                    item.innerText
                        .toLowerCase();

                item.style.display =
                    !query ||
                    text.includes(query)
                        ? ""
                        : "none";
            });
    }
);


/* =========================================================
   HISTORY CLICK
========================================================= */

document
    .querySelectorAll(
        ".history-item"
    )
    .forEach(item => {

        item.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".history-item"
                    )
                    .forEach(x =>
                        x.classList.remove(
                            "active"
                        )
                    );

                item.classList.add(
                    "active"
                );

                closeSidebar();
            }
        );

    });


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom() {

    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });
}

</script>
