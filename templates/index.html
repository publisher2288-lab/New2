<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrangeChat AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fcefe9; display: flex; justify-content: center; align-items: center; min-h: 100vh; height: 100vh; padding: 10px; }
        .chat-card { width: 100%; max-width: 480px; height: 90vh; bg-color: #ffffff; background: #ffffff; border-radius: 20px; shadow: 0 10px 25px rgba(255,107,53,0.15); box-shadow: 0 10px 25px rgba(255,107,53,0.15); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #ffdcd0; }
        .header { background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%); color: white; padding: 20px; display: flex; align-items: center; justify-content: space-between; }
        .header-title { font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .status { font-size: 0.75rem; color: #ffe5d9; margin-top: 2px; }
        .badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background-color: #fff9f6; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .ai { background-color: white; color: #2d3748; border-bottom-left-radius: 2px; border: 1px solid #ffe1d5; align-self: flex-start; }
        .user { background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%); color: white; border-bottom-right-radius: 2px; align-self: flex-end; }
        .input-area { padding: 15px; background: white; border-top: 1px solid #ffe1d5; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px 15px; border-radius: 12px; border: 1px solid #ffcdbc; background-color: #fffbf9; outline: none; font-size: 0.95rem; transition: all 0.3s; }
        input:focus { border-color: #ff6b35; box-shadow: 0 0 0 3px rgba(255,107,53,0.1); }
        button { background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: transform 0.1s, opacity 0.2s; box-shadow: 0 4px 10px rgba(255,107,53,0.2); }
        button:hover { opacity: 0.95; }
        button:active { transform: scale(0.97); }
        .loading { font-style: italic; color: #ff8c42; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

    <div class="chat-card">
        <!-- प्रीमियम ऑरेंज हेडर -->
        <div class="header">
            <div>
                <div class="header-title"><span>🤖</span> OrangeChat AI</div>
                <div class="status">● हमेशा ऑनलाइन • आपकी सहायता के लिए तैयार</div>
            </div>
            <div class="badge">Gemini 3.6</div>
        </div>

        <!-- चैट मैसेजेस एरिया -->
        <div id="chat-box" class="chat-box">
            <div class="msg ai">
                नमस्ते! मैं आपका नया सुपर स्टाइलिश असिस्टेंट हूँ। आपको यह नया ऑरेंज और व्हाइट थीम लुक कैसा लगा? मुझसे कुछ भी पूछें!
            </div>
        </div>

        <!-- इनपुट और बटन एरिया -->
        <div class="input-area">
            <input id="user-input" type="text" placeholder="अपना संदेश यहाँ टाइप करें..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">भेजें</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if(!input.value.trim()) return;
            
            const text = input.value;
            input.value = '';

            // 1. यूजर का मैसेज स्क्रीन पर जोड़ना
            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // लोडिंग दिखाना
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="msg ai loading">एआई सोच रहा है...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 2. बैकएंड से बात करना
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();
                
                // लोडिंग हटाना
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();

                // 3. AI का जवाब स्क्रीन पर जोड़ना
                chatBox.innerHTML += `<div class="msg ai">${data.reply}</div>`;
            } catch (error) {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();
                chatBox.innerHTML += `<div class="msg ai" style="color: red;">त्रुटि: कनेक्शन में समस्या आई।</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
