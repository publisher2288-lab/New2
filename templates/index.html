<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrangeChat - मेरा Premium AI</title>
    <!-- 100% लोड होने वाला सुरक्षित Bootstrap CSS लिंक -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .orange-header {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
            color: white;
            padding: 15px;
            border-radius: 15px 15px 0 0;
        }
        .chat-container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #ffe8db;
        }
        .chat-box {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background-color: #fffaf7;
        }
        .msg-ai {
            background-color: #ffffff;
            border: 1px solid #ffd0b5;
            color: #333;
            border-radius: 15px 15px 15px 0;
            padding: 10px 15px;
            margin-bottom: 15px;
            max-width: 85%;
            font-size: 14px;
        }
        .msg-user {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
            color: white;
            border-radius: 15px 15px 0 15px;
            padding: 10px 15px;
            margin-bottom: 15px;
            max-width: 85%;
            margin-left: auto;
            font-size: 14px;
        }
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #ffe8db;
            border-radius: 0 0 15px 15px;
        }
        .btn-orange {
            background-color: #ff6b35;
            color: white;
            border: none;
        }
        .btn-orange:hover {
            background-color: #e55a2b;
            color: white;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- ऑरेंज प्रीमियम हेडर -->
        <div class="orange-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <span class="fs-3 me-2">🤖</span>
                <div>
                    <h5 class="m-0 font-weight-bold">OrangeChat AI</h5>
                    <small style="color: #ffe0d1;">● ऑनलाइन सहायक</small>
                </div>
            </div>
            <span class="badge bg-light text-dark">Gemini 3.6</span>
        </div>

        <!-- चैट मैसेजेस एरिया -->
        <div id="chat-box" class="chat-box">
            <div class="d-flex align-items-start msg-ai">
                नमस्ते! मैं आपका नया सुपर स्टाइलिश असिस्टेंट हूँ। आपको यह नया ऑरेंज और व्हाइट थीम लुक कैसा लगा? मुझसे कुछ भी पूछें!
            </div>
        </div>

        <!-- इनपुट और बटन एरिया -->
        <div class="input-area">
            <div class="input-group">
                <input id="user-input" type="text" placeholder="अपना संदेश यहाँ टाइप करें..." class="form-control" onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" class="btn btn-orange px-4">भेजें ➔</button>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if(!input.value.trim()) return;
            
            const text = input.value;
            input.value = '';

            // 1. यूजर का मैसेज स्क्रीन पर जोड़ना
            chatBox.innerHTML += `
                <div class="msg-user text-start">
                    ${text}
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            // लोडिंग दिखाना
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="msg-ai text-muted">
                    <em>एआई सोच रहा है...</em>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 2. बैकएंड से बात करना
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();
                
                // लोडिंग हटाना
                document.getElementById(loadingId).remove();

                // 3. AI का जवाब स्क्रीन पर जोड़ना
                chatBox.innerHTML += `
                    <div class="msg-ai text-start">
                        ${data.reply}
                    </div>
                `;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="msg-ai text-danger">
                        त्रुटि: सर्वर से कनेक्ट नहीं हो पाया।
                    </div>
                `;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
