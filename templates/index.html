<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा खुद का AI</title>
    <!-- यह नया और 100% काम करने वाला Tailwind CSS का आधिकारिक स्क्रिप्ट लिंक है -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex flex-col h-screen font-sans">
    <header class="bg-gray-900 p-4 text-center text-xl font-bold border-b border-gray-800 tracking-wide text-blue-400">🤖 मेरा डोमेन, मेरा AI</header>
    <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 max-w-2xl mx-auto w-full"></div>
    <div class="p-4 bg-gray-900 border-t border-gray-800 max-w-2xl mx-auto w-full flex gap-3 mb-6 rounded-xl shadow-2xl">
        <input id="user-input" type="text" placeholder="यहाँ अपना सवाल टाइप करें..." class="flex-1 p-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500 transition-colors text-white">
        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 active:scale-95 px-6 py-3 rounded-lg font-bold transition-all shadow-md">भेजें</button>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if(!input.value.trim()) return;
            
            // यूजर का मैसेज स्क्रीन पर जोड़ना
            chatBox.innerHTML += `<div class="text-right"><span class="bg-blue-600 text-white px-4 py-2 rounded-lg inline-block max-w-xs shadow-md">${input.value}</span></div>`;
            const text = input.value;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // बैकएंड से बात करना
            const res = await fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text})
            });
            const data = await res.json();
            
            // AI का जवाब स्क्रीन पर जोड़ना
            chatBox.innerHTML += `<div class="text-left"><span class="bg-gray-800 border border-gray-700 text-gray-100 px-4 py-2 rounded-lg inline-block max-w-xs shadow-md">${data.reply}</span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
